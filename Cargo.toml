[package]
name = "mcpg-plugin-identity-kerberos"
version = "0.1.0-alpha.21"
license = "BUSL-1.1"
edition = "2024"
description = """
Kerberos / SPNEGO (HTTP Negotiate) identity plugin for mcpg
(dev.mcpg.identity.kerberos). Verifies an `Authorization: Negotiate` GSSAPI
token against a service keytab (MIT GSSAPI via libgssapi) and resolves the
caller's Kerberos principal as the identity.

NOTE: builds against the system GSSAPI (libkrb5/libgssapi_krb5). Kept out of
the workspace default-members so a plain `cargo build` does not require
krb5-dev; build explicitly with `-p mcpg-plugin-identity-kerberos`.
"""

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cdylib-export"]
cdylib-export = []
static-firstparty = []
# Gates the local-KDC integration suite (needs krb5-kdc + a temp realm).
integration-tests = []

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.17", version = "=0.1.0-beta.17" }
async-trait = "0.1"
base64 = "0.22"
# MIT GSSAPI bindings (server-side accept_sec_context). Links the system
# libgssapi_krb5 — no openssl/native-tls.
libgssapi = "0.11"
metrics = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
